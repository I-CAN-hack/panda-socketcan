CONFIG_CAN=y
CONFIG_CAN_FD_MODE=n
CONFIG_CANNECTIVITY_MAX_CHANNELS=3
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_GS_USB=y

# Only accept-all standard and extended filters are needed per channel.
CONFIG_CAN_STM32_BXCAN_MAX_STD_ID_FILTERS=2
CONFIG_CAN_STM32_BXCAN_MAX_EXT_ID_FILTERS=1

# Existing gs_usb identity for this private, compatible firmware build.
CONFIG_CANNECTIVITY_USB_VID=0x1d50
CONFIG_CANNECTIVITY_USB_PID=0x606f
CONFIG_CANNECTIVITY_USB_MANUFACTURER="I CAN Hack"
CONFIG_CANNECTIVITY_USB_PRODUCT="White Panda CANnectivity"
CONFIG_CANNECTIVITY_USB_SELF_POWERED=n

# The image starts at the flash base; flashing uses STM32's ROM DFU loader.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_CANNECTIVITY_DFU_SUPPORT=n
CONFIG_BUILD_OUTPUT_BIN=y

# The GNU Arm Embedded toolchain provides newlib, rather than picolibc.
CONFIG_NEWLIB_LIBC=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
